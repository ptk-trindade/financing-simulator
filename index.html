      <div><span>${p.nMonthly} × ${L('monthly', 'mensais')}</span><span>${brl(p.nMonthly * p.monthlyAmt)}</span></div>
      <div><span>${nAnnualUsed} × ${L('annual', 'anuais')}</span><span>${brl(nAnnualUsed * p.annualAmt)}</span></div>
      <div><span>${L('Keys payment', 'Parcela das chaves')}</span><span>${brl(p.keysPayment)}</span></div>
      <div><span>${L('Financed', 'Financiado')}</span><span>${brl(p.financed)}</span></div>
      <div class="diff${off ? ' off' : ''}"><span>${off ? L('Difference from price', 'Diferença para o preço') : L('Matches the price', 'Bate com o preço')}</span><span>${brl(s.planDiff)}</span></div>
    </div>`)
    const ic = document.getElementById('c-itbi')
    if (ic) {
      const it = s.cessao ? null : E.computeItbi({ ...p, itbiOverride: null }, s.loan)
      ic.textContent = s.cessao
        ? L('Not paid: you exit by cessão de direitos.', 'Não pago: você sai por cessão de direitos.')
        : it.rule === 'exempt' ? L('Auto: exempt (first property under the ceiling).', 'Auto: isento (primeiro imóvel abaixo do teto).')
        : it.rule === 'sfh' ? L(`Auto: ${brl(it.value)} = ${nfmt(p.itbiReducedRate)}% on ${brl0(it.reduced)} + ${nfmt(p.itbiRate)}% on ${brl0(it.base - it.reduced)}`, `Auto: ${brl(it.value)} = ${nfmt(p.itbiReducedRate)}% sobre ${brl0(it.reduced)} + ${nfmt(p.itbiRate)}% sobre ${brl0(it.base - it.reduced)}`)
        : L(`Auto: ${brl(it.value)} = ${nfmt(p.itbiRate)}% on ${brl0(it.base)}`, `Auto: ${brl(it.value)} = ${nfmt(p.itbiRate)}% sobre ${brl0(it.base)}`)
    }
    const tc = document.getElementById('c-acqTiming')
    if (tc) tc.textContent = s.acqMonth == null
      ? L('Not paid under cessão.', 'Não pagos na cessão.')
      : L(`Paid at month ${s.acqMonth} (${monthLabel(E.monthDate(p.startMonth, s.acqMonth))}).`, `Pagos no mês ${s.acqMonth} (${monthLabel(E.monthDate(p.startMonth, s.acqMonth))}).`)
    setHtml('x-presets', `<div class="presets">
      ${Object.entries(E.LINES).map(([k, l]) => `<button type="button" class="preset" data-line="${k}" aria-pressed="${p.line === k}"><b>${esc(l.label)}</b><span>${nfmt(l.bankRate)}% ${l.rateNominal ? 'nominal' : L('effective', 'efetiva')} + TR · ${L('LTV', 'cota')} ${l.ltvSac}% SAC / ${l.ltvPrice}% PRICE</span></button>`).join('')}
    </div><span class="hint">${L(`Presets fill the fields below. MCMV Classe Média: family income up to ${brl0(p.mcmvIncomeLimit)}, unit up to ${brl0(p.mcmvPriceLimit)}, first home.`, `Os atalhos preenchem os campos abaixo. MCMV Classe Média: renda familiar até ${brl0(p.mcmvIncomeLimit)}, imóvel até ${brl0(p.mcmvPriceLimit)}, primeiro imóvel.`)}</span>`)
    const fi = s.firstInstallment
    setHtml('x-first', fi == null
      ? `<span class="hint">${L('No bank loan in this scenario.', 'Sem financiamento bancário neste cenário.')}</span>`
      : `<span class="calc">${L(`First ${p.system} installment ≈ <b>${brl(fi)}</b> on ${brl0(s.loan)} · needs a family income of about ${brl0(fi / 0.3)} (30% rule)`, `Primeira prestação ${p.system} ≈ <b>${brl(fi)}</b> sobre ${brl0(s.loan)} · exige renda familiar de cerca de ${brl0(fi / 0.3)} (regra dos 30%)`)}</span>`)
    const constrTotal = s.rows.reduce((a, r) => a + (r.t <= s.T + p.averbacaoMonths && r.amort === 0 ? r.intTR + r.ins + r.fee : 0), 0)
    const tipId = 'tip-constr'
    const tipWasOpen = document.getElementById(tipId) && !document.getElementById(tipId).hidden
    setHtml('x-constr', `<div class="field wide"><span class="label">${L('Construction-phase charges (juros de obra)', 'Juros de obra (taxa de evolução de obra)')} ${tipBtn(tipId)}</span>
      <span class="calc">${p.structure === 'associativo' ? L(`${brl0(constrTotal)} over ${s.constructionMonths} months`, `${brl0(constrTotal)} em ${s.constructionMonths} meses`) : L('None under repasse na entrega.', 'Não há no repasse na entrega.')}</span>
      <div class="tipbody" id="${tipId}"${tipWasOpen ? '' : ' hidden'}>${L(
        'Real estate agents often describe this as “insurance, a % of the first installment that rises as the work progresses”. In fact it is the interest and TR on the money Caixa has already released to the builder, plus MIP and DFI insurance and the admin fee. Nothing is amortized, so it rises with each release until the keys.',
        'Corretores costumam descrever isso como “um seguro, um % da primeira parcela que sobe conforme a obra avança”. Na verdade são os juros e a TR sobre o valor que a Caixa já liberou à construtora, mais os seguros MIP e DFI e a taxa de administração. Não há amortização, então o valor sobe a cada liberação até as chaves.')}</div></div>`)
    setHtml('x-fi-calc', p.fiGrossMode
      ? `<span class="calc">${L(`Effective return after IR on these payments: <b>${pct(s.irrFi)}</b> a year. The month-0 payment is held ${E.daysBetween(E.monthDate(p.startMonth, 0), E.monthDate(p.startMonth, s.S))} days.`, `Rentabilidade efetiva após IR sobre esses aportes: <b>${pct(s.irrFi)}</b> ao ano. O aporte do mês 0 fica aplicado por ${E.daysBetween(E.monthDate(p.startMonth, 0), E.monthDate(p.startMonth, s.S))} dias.`)}</span>`
      : '')
    setHtml('sn-property', `${brl0(p.price)} · ${s.T} ${L('mo', 'meses')}`)
    setHtml('sn-bank', `${s.lineLabel} · ${p.structure === 'associativo' ? 'Associativo' : 'Repasse'}`)
    setHtml('sn-acq', s.cessao ? L('None (cessão)', 'Nenhum (cessão)') : brl0(s.itbi.value + s.registry))
    setHtml('sn-exit', `${brl0(p.salePrice)} · ${L('month', 'mês')} ${s.S}`)
    setHtml('sn-fi', p.fiGrossMode ? `${nfmt(p.fiGross)}% ${L('gross', 'bruto')}` : `${nfmt(p.fiNet)}% ${L('net', 'líquido')}`)
  }

  // ---------- Charts ----------
  function niceTicks(max, count = 4) {
    if (max <= 0) return { max: 1, ticks: [0, 1] }
    const raw = max / count
    const mag = Math.pow(10, Math.floor(Math.log10(raw)))
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw)
    const top = Math.ceil(max / step) * step
    const ticks = []
    for (let v = 0; v <= top + step / 2; v += step) ticks.push(v)
    return { max: top, ticks }
  }

  const tip = $('#tip')
  function showTip(html, x, y) {
    tip.innerHTML = html
    tip.hidden = false
    const r = tip.getBoundingClientRect()
    let left = x + 14
    let top = y + 14
    if (left + r.width > window.innerWidth - 8) left = x - r.width - 14
    if (top + r.height > window.innerHeight - 8) top = y - r.height - 14
    tip.style.left = Math.max(8, left) + 'px'
    tip.style.top = Math.max(8, top) + 'px'
  }
  const hideTip = () => { tip.hidden = true }

  function drawCumulative(s) {
    const el = $('#chart-cum')
    const W = Math.max(280, el.clientWidth || 600)
    const H = W < 520 ? 230 : 290
    const m = { l: 62, r: 14, t: 14, b: 34 }
    const pts = s.curve
    const S = s.S
    const netPt = s.at.net
    const { max, ticks } = niceTicks(Math.max(...pts.map((p) => Math.max(p.invested, p.valueB)), netPt > 0 ? netPt : 0))
    const x = (t) => m.l + (S === 0 ? 0 : (t / S) * (W - m.l - m.r))
    const y = (v) => m.t + (1 - v / max) * (H - m.t - m.b)
    const step = S <= 18 ? 3 : S <= 48 ? 6 : 12
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${L('Cumulative cash invested and fixed-income value by month', 'Dinheiro investido acumulado e valor na renda fixa por mês')}">`
    ticks.forEach((v) => {
      svg += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`
      svg += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v === 0 ? '0' : short(v)}</text>`
    })
    for (let t = 0; t <= S; t += step) svg += `<text x="${x(t)}" y="${H - m.b + 18}" text-anchor="middle">${t}</text>`
    svg += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>`
    svg += `<text x="${W - m.r}" y="${H - 2}" text-anchor="end">${L('months from contract', 'meses desde o contrato')}</text>`
    const path = (key) => pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p[key]).toFixed(1)}`).join('')
    svg += `<path class="a-fi" d="${path('valueB')}L${x(S)},${y(0)}L${x(0)},${y(0)}Z"/>`
    svg += `<path class="l-fi" d="${path('valueB')}"/>`
    svg += `<path class="l-buy" d="${path('invested')}"/>`
    if (netPt > 0) {
      svg += `<circle class="m-buy" cx="${x(S)}" cy="${y(netPt)}" r="6"/>`
      const ly = y(netPt) + (Math.abs(y(netPt) - y(s.fvB)) < 18 ? (netPt < s.fvB ? 18 : -10) : 4)
      svg += `<text class="lbl-strong" x="${x(S) - 12}" y="${ly}" text-anchor="end">${L('Net sale proceeds', 'Valor líquido da venda')} ${short(netPt)}</text>`
    }
    svg += `<line class="cross" id="cum-cross" x1="0" x2="0" y1="${m.t}" y2="${y(0)}" visibility="hidden"/>`
    svg += `<circle class="m-fi" id="cum-dfi" r="4.5" visibility="hidden"/><circle class="m-buy" id="cum-dbuy" r="4.5" visibility="hidden"/>`
    svg += `<rect class="hit" id="cum-hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/>`
    svg += '</svg>'
    el.innerHTML = svg
    $('#cum-legend').innerHTML =
      `<span><span class="swatch-line" style="background:var(--buy)"></span>${L('Cash invested', 'Dinheiro investido')} <b>${brl0(s.cash)}</b></span>` +
      `<span><span class="swatch-line" style="background:var(--fi)"></span>${L('Same cash in fixed income', 'Mesmo dinheiro na renda fixa')} <b>${brl0(s.fvB)}</b></span>` +
      `<span><span class="dot buy"></span>${L('Net sale proceeds', 'Valor líquido da venda')} <b>${brl0(netPt)}</b></span>`
    const hit = document.getElementById('cum-hit')
    const cross = document.getElementById('cum-cross')
    const dfi = document.getElementById('cum-dfi')
    const dbuy = document.getElementById('cum-dbuy')
    const svgEl = el.querySelector('svg')
    const move = (ev) => {
      const rect = svgEl.getBoundingClientRect()
      const px = ((ev.clientX - rect.left) / rect.width) * W
      const t = Math.max(0, Math.min(S, Math.round(((px - m.l) / (W - m.l - m.r)) * S)))
      const p = pts[t]
      const row = s.rows[t]
      for (const [n, v] of [[cross, null], [dfi, p.valueB], [dbuy, p.invested]]) {
        n.setAttribute('visibility', 'visible')
        if (v == null) { n.setAttribute('x1', x(t)); n.setAttribute('x2', x(t)) }
        else { n.setAttribute('cx', x(t)); n.setAttribute('cy', y(v)) }
      }
      showTip(`<b>${L('Month', 'Mês')} ${t} · ${monthLabel(row.date)}</b>
        <div class="row"><span><span class="dot fi"></span>${L('Fixed income', 'Renda fixa')}</span><b>${brl0(p.valueB)}</b></div>
        <div class="row"><span><span class="dot buy"></span>${L('Cash invested', 'Dinheiro investido')}</span><b>${brl0(p.invested)}</b></div>
        <div class="row"><span>${L('Paid this month', 'Pago neste mês')}</span><span>${brl0(row.total)}</span></div>`, ev.clientX, ev.clientY)
    }
    hit.addEventListener('pointermove', move)
    hit.addEventListener('pointerdown', move)
    hit.addEventListener('pointerleave', () => {
      hideTip()
      ;[cross, dfi, dbuy].forEach((n) => n.setAttribute('visibility', 'hidden'))
    })
  }

  let lastTornado = null
  function drawTornado(s, tor) {
    lastTornado = tor
    const el = $('#chart-tornado')
    const W = Math.max(280, el.clientWidth || 600)
    const items = tor.items.filter((it) => it.low != null || it.high != null)
    const rowH = 46
    const m = { l: 8, r: 8, t: 30, b: 8 }
    const H = m.t + items.length * rowH + m.b
    const vals = items.flatMap((it) => [it.low, it.high]).concat([tor.base, s.p.salePrice]).filter(ok)
    let lo = Math.min(...vals)
    let hi = Math.max(...vals)
    if (hi - lo < 1000) { lo -= 500; hi += 500 }
    const padL = W < 480 ? 84 : 112
    const padR = W < 480 ? 84 : 112
    const x = (v) => m.l + padL + ((v - lo) / (hi - lo)) * (W - m.l - m.r - padL - padR)
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${L('Break-even price sensitivity', 'Sensibilidade do preço de equilíbrio')}">`
    if (ok(tor.base)) {
      svg += `<line class="ref" x1="${x(tor.base)}" x2="${x(tor.base)}" y1="${m.t - 6}" y2="${H - m.b}"/>`
      svg += `<text class="lbl" x="${x(tor.base)}" y="${m.t - 12}" text-anchor="middle">${L('Break-even', 'Equilíbrio')} ${short(tor.base)}</text>`
    }
    const sp = s.p.salePrice
    if (sp >= lo && sp <= hi && Math.abs(x(sp) - x(tor.base)) > 4) {
      svg += `<line class="ref-buy" x1="${x(sp)}" x2="${x(sp)}" y1="${m.t + 2}" y2="${H - m.b}"/>`
      if (Math.abs(x(sp) - x(tor.base)) > 120) svg += `<text class="lbl" x="${x(sp)}" y="${m.t - 12}" text-anchor="middle">${L('Your price', 'Seu preço')}</text>`
    }
    items.forEach((it, idx) => {
      const meta = TOR[it.key]
      const y0 = m.t + idx * rowH
      const ly = y0 + 30
      const name = tx(meta.label)
      svg += `<text class="lbl-strong" x="${m.l}" y="${y0 + 13}">${esc(name)}</text>`
      const ends = [
        { v: it.low, setting: meta.fmt(it.lowSet) },
        { v: it.high, setting: meta.fmt(it.highSet) },
      ].filter((e) => ok(e.v))
      if (!ends.length) return
      const vs = ends.map((e) => e.v)
      const a = Math.min(...vs, tor.base)
      const b = Math.max(...vs, tor.base)
      svg += `<line class="db-line" x1="${x(a)}" x2="${x(b)}" y1="${ly}" y2="${ly}"/>`
      ends.sort((p, q) => p.v - q.v)
      const same = ends.length === 2 && Math.abs(ends[0].v - ends[1].v) < 1
      ends.forEach((e, i) => {
        const tipText = `<b>${esc(name)}: ${esc(e.setting)}</b><div>${L('Break-even', 'Equilíbrio')} ${brl0(e.v)} (${spct(e.v / tor.base - 1)} ${L('vs current', 'vs atual')})</div>`
        svg += `<circle class="db-dot" cx="${x(e.v)}" cy="${ly}" r="5.5"/>`
        svg += `<circle class="hit" cx="${x(e.v)}" cy="${ly}" r="14" data-tip="${esc(tipText)}"/>`
        if (same && i === 1) return
        const left = i === 0 && ends.length === 2 ? true : ends.length === 1 ? e.v < tor.base : false
        const tx2 = left ? x(Math.min(e.v, tor.base)) - 10 : x(Math.max(e.v, tor.base)) + 10
        const label = same ? `${ends[0].setting} / ${ends[1].setting}` : e.setting
        svg += `<text x="${tx2}" y="${ly + 4}" text-anchor="${left ? 'end' : 'start'}"><tspan class="lbl">${esc(label)}</tspan> ${short(e.v)}</text>`
      })
    })
    svg += '</svg>'
    el.innerHTML = svg
  }
  document.addEventListener('pointerover', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]')
    if (t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY)
  })
  document.addEventListener('pointerout', (e) => {
    if (e.target.closest && e.target.closest('[data-tip]')) hideTip()
  })

  // ---------- Tables ----------
  function renderBreakdown(s) {
    const p = s.p
    const sum = (k) => s.rows.reduce((a, r) => a + r[k], 0)
    const cell = (v, neg) => (ok(v) && Math.abs(v) > 0.004 ? `<td${neg ? ' class="neg"' : ''}>${neg ? '−' : ''}${brl(Math.abs(v))}</td>` : '<td class="zero">–</td>')
    const row = (label, oop, sale, cls = '') => `<tr class="${cls}"><td>${label}</td>${cell(oop)}${cell(sale, sale > 0)}</tr>`
    const sh = sum('shortfall')
    const taxNote = s.at.exemption === 'reinvest' ? L(' (exempt: reinvestment)', ' (isento: reinvestimento)') : s.at.exemption === 'single' ? L(' (exempt: single property)', ' (isento: imóvel único)') : p.applyFr2 ? ` (FR2 ${nfmt(s.fr2, 4)})` : ''
    const devSaleLabel = s.cessao
      ? L('Developer balance assumed by the buyer', 'Saldo da construtora assumido pelo comprador')
      : p.settleAtSale ? L('Developer balance paid off at sale', 'Saldo da construtora quitado na venda') : L('Developer balance taken over by the buyer', 'Saldo da construtora assumido pelo comprador')
    $('#breakdown').innerHTML = `<table class="breakdown">
      <thead><tr><th>${L('Item', 'Item')}</th><th>${L('Out of pocket', 'Do próprio bolso')}</th><th>${L('Settled at sale', 'Acertado na venda')}</th></tr></thead>
      <tbody>
        <tr class="sect"><td colspan="3">${L('Before the sale', 'Antes da venda')}</td></tr>
        ${row(L('Paid to developer (INCC-corrected)', 'Pago à construtora (corrigido pelo INCC)'), sum('dev') + sh, null)}
        ${sh > 0.5 ? row(L('of which: gap above the bank’s LTV cap, paid at keys', 'dos quais: diferença acima da cota do banco, paga nas chaves'), sh, null, 'indent') : ''}
        ${row(L('Bank: interest + TR', 'Banco: juros + TR'), sum('intTR'), null)}
        ${row(L('Bank: insurance (MIP + DFI)', 'Banco: seguros (MIP + DFI)'), sum('ins'), null)}
        ${row(L('Bank: admin fee', 'Banco: taxa de administração'), sum('fee'), null)}
        ${row(L('Bank: amortization', 'Banco: amortização'), sum('amort'), null)}
        ${row('ITBI', sum('itbi'), null)}
        ${row(L('Registry', 'Registro'), sum('registry'), null)}
        ${row(L('Appraisal fee', 'Taxa de avaliação'), sum('apprFee'), null)}
        ${row(L('Condo + IPTU', 'Condomínio + IPTU'), sum('condo'), null)}
        ${row(L('Total cash invested', 'Total investido'), s.cash, null, 'total')}
        ${row(L('Opportunity cost (what fixed income would have earned)', 'Custo de oportunidade (o que a renda fixa teria rendido)'), s.fvB - s.cash, null)}
        ${row(L('Future value of Scenario B (fixed income)', 'Valor futuro do cenário B (renda fixa)'), s.fvB, null, 'total strong')}
        <tr class="sect"><td colspan="3">${L(`At the sale (month ${s.S})`, `Na venda (mês ${s.S})`)}</td></tr>
        <tr><td>${L('Sale price', 'Preço de venda')}</td><td class="zero">–</td><td>${brl(s.at.P)}</td></tr>
        ${row(L(`Broker commission (${nfmt(p.commission)}%)`, `Comissão do corretor (${nfmt(p.commission)}%)`), null, s.at.commission)}
        ${row(L('Capital gains tax', 'Imposto sobre ganho de capital') + taxNote, null, s.at.tax)}
        ${s.cessao ? row(L('Financed part assumed by the buyer (INCC-corrected)', 'Parte financiada assumida pelo comprador (corrigida pelo INCC)'), null, s.assumed) : row(L('Bank balance at sale', 'Saldo devedor do banco na venda'), null, s.bankBalance)}
        ${row(devSaleLabel, null, s.devBalance)}
        ${row(L('Other exit fees', 'Outros custos de saída') + ' (' + (s.cessao ? L('cessão fee', 'taxa de cessão') : L('lien release', 'baixa da alienação')) + ')', null, s.lien + s.cessaoFee)}
        <tr class="total strong"><td>${L('Net sale proceeds', 'Valor líquido da venda')}</td><td class="zero">–</td><td>${brl(s.at.net)}</td></tr>
        <tr class="indent"><td>${L(`Taxable gain ${brl0(s.at.gain)} on a cost basis of ${brl0(s.basisTotal)}`, `Ganho tributável de ${brl0(s.at.gain)} sobre um custo de aquisição de ${brl0(s.basisTotal)}`)}</td><td></td><td></td></tr>
      </tbody></table>`
  }

  function renderGrid(s) {
    const p = s.p
    const g = E.grid(state)
    const fiCur = p.fiGrossMode ? p.fiGross : p.fiNet
    const cell = (v, base) => `<td class="${base ? 'base ' : ''}${ok(v) && v <= p.salePrice ? 'win' : ''}">${ok(v) ? brl0(v) : '> R$ 5 mi'}</td>`
    const fiKind = p.fiGrossMode ? L('gross', 'bruta') : L('net', 'líquida')
    $('#grid').innerHTML = `
      <div class="tablewrap"><table class="gridtable">
        <thead><tr><th>${L(`INCC ↓ · ${fiKind} fixed income →`, `INCC ↓ · renda fixa ${fiKind} →`)}</th>${g.fi.map((f) => `<th>${f}%</th>`).join('')}</tr></thead>
        <tbody>${g.incc.map((ic, r) => `<tr><td>INCC ${ic}%</td>${g.cells[r].map((v, c) => cell(v, ic === p.incc && g.fi[c] === fiCur)).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <div class="tablewrap"><table class="gridtable">
        <thead><tr><th>${L('Bank rate', 'Taxa do banco')} (${p.rateNominal ? 'nominal' : L('effective', 'efetiva')})</th>${g.bankRates.map((b) => `<th>${b.rate}%</th>`).join('')}<th>SAC</th><th>PRICE</th></tr></thead>
        <tbody><tr><td>${L('Break-even', 'Equilíbrio')}</td>${g.bankRates.map((b) => cell(b.value, b.rate === p.bankRate)).join('')}${g.systems.map((x) => cell(x.value, x.system === p.system)).join('')}</tr></tbody>
      </table></div>
      <p class="gridnote">${L(
        `Outlined: your current inputs. ✓ in green: break-even at or below your expected sale price of ${brl0(p.salePrice)}, so buying wins. SAC vs PRICE only changes the result when you hold after the keys or under repasse (it changes the LTV cap).`,
        `Contornado: seus dados atuais. ✓ em verde: equilíbrio igual ou abaixo do seu preço de venda esperado de ${brl0(p.salePrice)}, então comprar vence. SAC x PRICE só muda o resultado quando você fica com o imóvel após as chaves ou no repasse (muda a cota máxima).`)}</p>`
  }

  function renderMonthly(s) {
    const cell = (v) => (Math.abs(v) > 0.004 ? `<td>${brl(v)}</td>` : '<td class="zero">–</td>')
    const tot = { dev: 0, bank: 0, acq: 0, condo: 0, total: 0, fv: 0, opp: 0 }
    const body = s.rows.map((r) => {
      tot.dev += r.devTotal; tot.bank += r.bank; tot.acq += r.acq; tot.condo += r.condo; tot.total += r.total; tot.fv += r.fv; tot.opp += r.opp
      const tag = r.t === s.T ? L(' · keys', ' · chaves') : ''
      const sale = r.t === s.S && s.S !== s.T ? L(' · sale', ' · venda') : ''
      return `<tr><td>${r.t}${tag}${sale}</td><td>${monthLabel(r.date)}</td>${cell(r.devTotal)}${cell(r.bank)}${cell(r.acq)}${cell(r.condo)}${cell(r.total)}${cell(r.fv)}${cell(r.opp)}</tr>`
    }).join('')
    $('#monthly-table').innerHTML = `<table class="monthly-table">
      <thead><tr><th>${L('Month', 'Mês')}</th><th>${L('Date', 'Data')}</th><th>${L('Developer', 'Construtora')}</th><th>${L('Bank charges', 'Encargos do banco')}</th><th>${L('Acquisition', 'Aquisição')}</th><th>${L('Other (condo, IPTU)', 'Outros (condomínio, IPTU)')}</th><th>${L('Total out', 'Total pago')}</th><th>${L('Value at sale month', 'Valor no mês da venda')}</th><th>${L('Opportunity cost', 'Custo de oportunidade')}</th></tr></thead>
      <tbody>${body}<tr class="total"><td>${L('Total', 'Total')}</td><td></td>${cell(tot.dev)}${cell(tot.bank)}${cell(tot.acq)}${cell(tot.condo)}${cell(tot.total)}${cell(tot.fv)}${cell(tot.opp)}</tr></tbody></table>`
  }

  // ---------- Tests ----------
  const CHECK_NAMES = {
    cash: ['Cash invested', 'Total investido'],
    fvB: ['Scenario B', 'Cenário B'],
    devBalance: ['Developer balance', 'Saldo da construtora'],
    assumed: ['Balance assumed', 'Saldo assumido'],
    cessaoFee: ['Cessão fee', 'Taxa de cessão'],
    breakEven: ['Break-even', 'Equilíbrio'],
  }
  function renderTests() {
    const box = $('#tests')
    const results = E.runTests()
    box.hidden = false
    box.innerHTML = results.map((r, i) => `
      <div class="panel" style="margin-top:8px">
        <h2>${esc(tx(TEST_NAMES[r.id]) || r.name)} · <span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? L('PASS', 'OK') : L('FAIL', 'FALHOU')}</span></h2>
        <div class="tablewrap"><table><thead><tr><th>${L('Check', 'Verificação')}</th><th>${L('Expected', 'Esperado')}</th><th>${L('Got', 'Obtido')}</th><th>${L('Result', 'Resultado')}</th></tr></thead><tbody>
        ${r.checks.map((c) => `<tr><td>${esc(tx(CHECK_NAMES[c.key]) || c.key)}</td><td>${brl0(c.expected)}</td><td>${brl(c.got)}</td><td class="${c.pass ? 'pass' : 'fail'}">${c.pass ? L('pass', 'ok') : L('fail', 'falhou')}</td></tr>`).join('')}
        </tbody></table></div>
        <div><button type="button" class="btn" data-load-test="${i}">${L('Load these inputs', 'Carregar estes dados')}</button></div>
      </div>`).join('') + `<p class="hint">${L('Tolerance ± R$ 500. Loading a test replaces your inputs; use Reset to go back to the defaults.', 'Tolerância de ± R$ 500. Carregar um teste substitui seus dados; use Restaurar padrões para voltar.')}</p>`
  }
  $('#run-tests').addEventListener('click', renderTests)
  $('#tests').addEventListener('click', (e) => {
    const b = e.target.closest('[data-load-test]')
    if (!b) return
    fillDraft(E.TESTS[+b.dataset.loadTest].inputs)
    window.scrollTo({ top: 0, behavior: 'smooth' })
  })

  // ---------- Resize ----------
  let rz = null
  const redraw = () => {
    if (!sim) return
    drawCumulative(sim)
    if (lastTornado) drawTornado(sim, lastTornado)
  }
  try {
    const ro = new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(redraw, 80) })
    ro.observe($('#chart-cum'))
  } catch (e) {
    window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(redraw, 80) })
  }

  renderStatic()
  renderInputs()
  recompute()
})()
</script>
