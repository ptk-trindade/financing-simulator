<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financing Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: inputs in a sticky left rail on wide screens; results first, inputs second on phones. */
:root {
  --bg: #f1f2f4;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --ink: #15181d;
  --ink-2: #454b56;
  --muted: #697080;
  --line: #dde0e6;
  --line-2: #c5cad3;
  --buy: #2a78d6;
  --buy-soft: #e5eefa;
  --fi: #eb6834;
  --fi-soft: #fdede4;
  --good: #1d7a43;
  --good-soft: #e3f2e8;
  --warn: #935900;
  --warn-soft: #fbefd9;
  --bad: #b53131;
  --bad-soft: #f8e3e3;
  --font-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1a1d22; --surface-2: #20242a; --ink: #eceef1; --ink-2: #c4c8cf; --muted: #959ba6;
    --line: #2c3139; --line-2: #3d434d; --buy: #3987e5; --buy-soft: #172539; --fi: #d95926; --fi-soft: #33200f;
    --good: #5cc98a; --good-soft: #132a1d; --warn: #e3a646; --warn-soft: #32260e; --bad: #f07676; --bad-soft: #391818;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d22; --surface-2: #20242a; --ink: #eceef1; --ink-2: #c4c8cf; --muted: #959ba6;
  --line: #2c3139; --line-2: #3d434d; --buy: #3987e5; --buy-soft: #172539; --fi: #d95926; --fi-soft: #33200f;
  --good: #5cc98a; --good-soft: #132a1d; --warn: #e3a646; --warn-soft: #32260e; --bad: #f07676; --bad-soft: #391818;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.page {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 96px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(1.35rem, 1rem + 1.4vw, 1.9rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--buy); outline-offset: 2px; }
.num, td, .v { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 18px; }
.top > div:first-child { display: grid; gap: 6px; min-width: 0; max-width: 46rem; flex: 1 1 22rem; }
.top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 7px 12px;
  cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-2); }
.lang { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; padding: 7px 11px; cursor: pointer; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.04em; color: var(--muted); }
.lang button + button { border-left: 1px solid var(--line-2); }
.lang button[aria-checked="true"] { background: var(--ink); color: var(--surface); }

.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.layout > * { min-width: 0; max-width: 100%; }
.summary, .details { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.inputs { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; }
@media (min-width: 1040px) {
  .layout { grid-template-columns: 410px minmax(0, 1fr); grid-template-areas: "inputs summary" "inputs details"; align-items: start; }
  .inputs { grid-area: inputs; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; padding-right: 4px; overscroll-behavior: contain; }
  .summary { grid-area: summary; }
  .details { grid-area: details; }
}

/* ---------- Summary ---------- */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 14px; }
.hero-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.headline { overflow-wrap: anywhere; font-family: var(--font-display); font-size: clamp(1.4rem, 1.05rem + 1.6vw, 2.1rem); font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; font-weight: 600; border: 1px solid var(--line-2); background: var(--surface-2); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.buy { background: var(--buy); } .dot.fi { background: var(--fi); }
.vsbars { display: grid; gap: 8px; }
.vsrow { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.vsrow .lab { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
.track { position: relative; height: 26px; }
.fill { position: absolute; left: 0; top: 4px; height: 18px; border-radius: 0 4px 4px 0; }
.fill.buy { background: var(--buy); } .fill.fi { background: var(--fi); }
.track .amt { position: absolute; top: 3px; font-weight: 600; white-space: nowrap; }
@media (max-width: 520px) { .vsrow { grid-template-columns: minmax(0, 1fr); } }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .stats { grid-template-columns: minmax(0, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.stat .k { color: var(--ink-2); font-weight: 500; }
.stat .v { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; }
.stat .s { color: var(--muted); font-size: 0.85rem; }
.stat .s b { color: var(--ink-2); font-weight: 600; }

/* ---------- Inputs ---------- */
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.group > summary {
  list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: baseline; justify-content: space-between;
  font-family: var(--font-display); font-weight: 600; font-size: 0.98rem;
}
.group > summary::-webkit-details-marker { display: none; }
.group > summary::after { content: "+"; font-family: var(--font-body); color: var(--muted); font-weight: 400; font-size: 1.1rem; margin-left: 4px; }
.group[open] > summary::after { content: "−"; }
.group > summary .sum-note { font-family: var(--font-body); font-weight: 400; font-size: 0.8rem; color: var(--muted); margin-left: auto; text-align: right; }
.fields { display: grid; gap: 10px; padding: 2px 14px 14px; }
.fields > * { min-width: 0; }
.sub { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) 9.6rem; gap: 2px 10px; align-items: center; }
.field > .label { color: var(--ink-2); font-size: 0.86rem; line-height: 1.3; }
.field > .hint, .field > .calc, .field > .tipbody { grid-column: 1 / -1; }
.hint { color: var(--muted); font-size: 0.76rem; line-height: 1.35; }
.calc { font-size: 0.78rem; color: var(--ink-2); }
.calc.bad { color: var(--bad); } .calc.good { color: var(--good); }
.inbox { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface-2); min-width: 0; }
.inbox:focus-within { border-color: var(--buy); }
.inbox input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.inbox input[type="month"], .inbox input.text { text-align: left; }
.inbox input::placeholder { color: var(--muted); }
.inbox .pre, .inbox .suf { color: var(--muted); font-size: 0.78rem; padding: 0 7px; white-space: nowrap; }
.inbox .pre { padding-right: 0; }
.inbox:has(input[aria-invalid="true"]) { border-color: var(--bad); }
.field.wide { grid-template-columns: minmax(0, 1fr); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; background: var(--surface-2); justify-self: end; }
.field.wide .seg { justify-self: stretch; }
.seg button { border: 0; background: transparent; padding: 6px 10px; cursor: pointer; font-size: 0.82rem; flex: 1; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; color: var(--ink-2); font-size: 0.86rem; line-height: 1.35; }
.check input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--buy); flex: none; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.preset { text-align: left; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; }
.preset b { font-weight: 600; }
.preset span { font-size: 0.75rem; color: var(--muted); }
.preset[aria-pressed="true"] { border-color: var(--buy); background: var(--buy-soft); }
.tip { border: 1px solid var(--line-2); background: var(--surface); width: 18px; height: 18px; border-radius: 50%; font-size: 0.7rem; line-height: 1; cursor: pointer; padding: 0; margin-left: 4px; color: var(--ink-2); vertical-align: 1px; }
.tipbody { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font-size: 0.8rem; color: var(--ink-2); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--buy); cursor: pointer; font-size: 0.76rem; text-decoration: underline; }
.consist { display: grid; gap: 2px; font-size: 0.8rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
.consist div { display: flex; justify-content: space-between; gap: 8px; }
.consist .diff { font-weight: 600; border-top: 1px solid var(--line); padding-top: 3px; margin-top: 2px; }
.consist .diff.off { color: var(--bad); }

/* ---------- Saved simulations ---------- */
.save-form { display: flex; gap: 8px; }
.save-form .inbox { flex: 1; }
.save-form .btn { padding: 6px 12px; }
.btn:disabled { opacity: 0.5; cursor: default; border-color: var(--line-2); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.save-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.save-row { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 7px; padding: 2px 4px 2px 10px; background: var(--surface-2); min-width: 0; }
.save-row.current { border-color: var(--buy); background: var(--buy-soft); }
.save-row .name { flex: 1; min-width: 0; text-align: left; border: 0; background: none; cursor: pointer; padding: 5px 0; display: flex; gap: 8px; align-items: baseline; }
.save-row .name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.save-row .tag { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.save-row .rename { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--buy); border-radius: 5px; padding: 3px 6px; margin: 2px 0; outline: none; }
.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 5px 7px; border-radius: 5px; font-size: 0.9rem; line-height: 1; white-space: nowrap; }
.icon-btn:hover { color: var(--ink); background: var(--surface); }
.icon-btn.on { color: var(--warn); }
.icon-btn.armed { color: var(--bad); font-size: 0.78rem; font-weight: 600; }

/* ---------- Panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.panel > *, .hero > * { min-width: 0; }
#grid { display: grid; gap: 10px; }
.panel > .intro { color: var(--muted); font-size: 0.85rem; max-width: 62ch; }
details.panel { display: block; }
details.panel[open] > summary { margin-bottom: 12px; }
details.panel > .tablewrap { max-width: 100%; }
details.panel > summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: attr(data-show); font-family: var(--font-body); font-weight: 500; font-size: 0.82rem; color: var(--buy); }
details.panel[open] > summary::after { content: attr(data-hide); }

.warnings { display: grid; gap: 8px; }
.warn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; border-radius: 8px; padding: 9px 12px; border: 1px solid var(--line); background: var(--surface); }
.warn .sev { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 5px; padding: 2px 6px; margin-top: 1px; white-space: nowrap; }
.warn.bad .sev { background: var(--bad-soft); color: var(--bad); }
.warn.warn .sev { background: var(--warn-soft); color: var(--warn); }
.warn.info .sev { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.85rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend b { color: var(--ink); font-weight: 600; }
.swatch-line { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.chart .lbl { fill: var(--ink-2); font-size: 12px; }
.chart .lbl-strong { fill: var(--ink); font-size: 12px; font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.chart .ref { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .ref-buy { stroke: var(--buy); stroke-width: 1.5; stroke-dasharray: 2 3; }
.chart .l-buy { stroke: var(--buy); fill: none; stroke-width: 2; }
.chart .l-fi { stroke: var(--fi); fill: none; stroke-width: 2; }
.chart .a-fi { fill: var(--fi); opacity: 0.08; }
.chart .m-buy { fill: var(--buy); stroke: var(--surface); stroke-width: 2; }
.chart .m-fi { fill: var(--fi); stroke: var(--surface); stroke-width: 2; }
.chart .cross { stroke: var(--ink-2); stroke-width: 1; }
.chart .db-line { stroke: var(--line-2); stroke-width: 6; stroke-linecap: round; }
.chart .db-dot { fill: var(--ink-2); stroke: var(--surface); stroke-width: 2; }
.chart .hit { fill: transparent; }
.tooltip {
  position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--surface);
  border-radius: 7px; padding: 7px 10px; font-size: 0.8rem; line-height: 1.4; max-width: 260px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.18);
  font-variant-numeric: tabular-nums;
}
.tooltip b { font-weight: 600; }
.tooltip .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tooltip .row span:first-child { display: inline-flex; gap: 6px; align-items: center; }

.tablewrap { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--ink-2); font-size: 0.78rem; background: var(--surface-2); }
tr.total td { font-weight: 600; border-top: 1px solid var(--line-2); }
tr.strong td { font-weight: 700; }
tr.indent td:first-child { padding-left: 24px; color: var(--ink-2); }
tr.sect td { background: var(--surface-2); color: var(--muted); font-size: 0.72rem; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 600; }
td.zero { color: var(--muted); }
td.neg { color: var(--ink-2); }
.breakdown td:first-child { white-space: normal; min-width: 12rem; }
.monthly-table td:first-child, .monthly-table th:first-child { position: sticky; left: 0; background: var(--surface); }
.monthly-table th:first-child { background: var(--surface-2); }

.gridtable td.base { outline: 2px solid var(--ink-2); outline-offset: -2px; font-weight: 600; }
.gridtable td.win { color: var(--good); }
.gridtable td.win::before { content: "✓ "; }
.gridnote { font-size: 0.8rem; color: var(--muted); }

.notes { font-size: 0.86rem; color: var(--ink-2); }
.notes h3 { font-size: 0.92rem; color: var(--ink); margin-top: 6px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.notes p { max-width: 70ch; }

.foot { display: grid; gap: 10px; justify-items: start; padding: 8px 2px; }
.quiet { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 0.78rem; padding: 2px 0; text-decoration: underline dotted; }
.pass { color: var(--good); font-weight: 700; } .fail { color: var(--bad); font-weight: 700; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: none;
  background: var(--surface); border-top: 1px solid var(--line-2);
  padding: 9px max(16px, env(safe-area-inset-right, 0px)) calc(9px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -4px 14px rgb(0 0 0 / 0.08);
}
.bar .in { display: flex; gap: 6px 14px; flex-wrap: wrap; justify-content: space-between; align-items: center; max-width: 1320px; margin: 0 auto; font-size: 0.85rem; }
.bar b { font-weight: 700; }
@media (max-width: 1039px) { .bar.show { display: block; } }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width 0.25s ease; } }
</style>

<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
      <p class="muted" data-i18n="subtitle"></p>
    </div>
    <div class="top-actions">
      <div class="lang" role="radiogroup" aria-label="Language / Idioma">
        <button type="button" role="radio" data-lang="en" lang="en">EN</button>
        <button type="button" role="radio" data-lang="pt" lang="pt-BR">PT</button>
      </div>
      <button type="button" class="btn" id="reset" data-i18n="reset"></button>
    </div>
  </header>

  <main class="layout">
    <section class="summary" id="summary" aria-live="polite"></section>
    <aside class="inputs" id="inputs"></aside>
    <section class="details" id="details">
      <div class="warnings" id="warnings"></div>

      <article class="panel">
        <h2 data-i18n="cumTitle"></h2>
        <p class="intro" data-i18n="cumIntro"></p>
        <div class="legend" id="cum-legend"></div>
        <div class="chart" id="chart-cum"></div>
      </article>

      <article class="panel">
        <h2 data-i18n="bdTitle"></h2>
        <div class="tablewrap" id="breakdown"></div>
      </article>

      <article class="panel">
        <h2 data-i18n="torTitle"></h2>
        <p class="intro" data-i18n="torIntro"></p>
        <div class="chart" id="chart-tornado"></div>
      </article>

      <article class="panel">
        <h2 data-i18n="gridTitle"></h2>
        <div id="grid"></div>
      </article>

      <details class="panel" id="monthly">
        <summary data-i18n="monthlyTitle"></summary>
        <div class="tablewrap" id="monthly-table"></div>
      </details>

      <article class="panel notes" id="notes"></article>

      <footer class="foot">
        <button type="button" class="quiet" id="run-tests" data-i18n="runTests"></button>
        <div id="tests" hidden></div>
      </footer>
    </section>
  </main>
</div>
<div class="bar" id="bar"><div class="in" id="bar-in"></div></div>
<div class="tooltip" id="tip" hidden></div>

<script>
/*
 * Off-plan flip vs fixed income: calculation engine.
 * Pure functions only (no DOM). Inlined into the page by build.mjs and imported by test.mjs.
 * Exposes globalThis.OffplanEngine.
 */
;(function (root) {
  'use strict'

  /** Annual % (effective) -> monthly fraction. */
  const eff = (annualPct) => Math.pow(1 + annualPct / 100, 1 / 12) - 1

  const LINES = {
    SBPE: { label: 'SBPE', bankRate: 11.49, rateNominal: false, ltvSac: 80, ltvPrice: 70 },
    MCMV: { label: 'MCMV Classe Média', bankRate: 10.0, rateNominal: true, ltvSac: 90, ltvPrice: 80 },
  }

  /**
   * The worked example from the spec. The reference tests run on it, so keep these values fixed.
   * null on an "auto" field means: derive it from other inputs.
   */
  const SPEC_EXAMPLE = Object.freeze({
    // 2.1 Property and developer payment plan
    price: 389900,
    monthsToKeys: 24,
    downPayment: 3000,
    nMonthly: 40,
    monthlyAmt: 1564.39,
    nAnnual: 3,
    annualAmt: 3000,
    annualMonths: '12, 24, 36',
    keysPayment: 1564.4,
    financed: 313760,
    incc: 6,
    postKeysIndex: 18,
    settleAtSale: true,
    earlyDiscount: 0,
    appraisalValue: null, // auto = price
    appraisalAtKeys: null, // auto = price corrected by INCC to keys
    // 2.2 Bank financing
    line: 'SBPE',
    structure: 'associativo', // 'associativo' | 'repasse'
    system: 'SAC', // 'SAC' | 'PRICE'
    bankRate: 11.49,
    rateNominal: false,
    ltvSac: 80,
    ltvPrice: 70,
    tr: 0.12,
    term: 420,
    mip: 0.025,
    dfi: 0.005,
    adminFee: 25,
    appraisalFee: 0,
    releasedAtSigning: 30,
    releaseCurve: 'linear', // 'linear' | 's'
    averbacaoMonths: 0,
    allIn: false,
    allInRate: 13.5,
    mcmvIncomeLimit: 13000,
    mcmvPriceLimit: 600000,
    // 2.3 Acquisition costs
    itbiOverride: null, // auto = rule
    itbiRate: 3,
    itbiReducedRate: 0.5,
    itbiReducedCap: 120968,
    itbiMaxValue: 725808,
    itbiExemptCeiling: 245527.77,
    firstProperty: false,
    valorVenal: null, // auto = price
    registry: 6530,
    registryDiscount: false,
    acqTiming: 'auto', // 'auto' | 'month0' | 'keys'
    // 2.4 Exit
    salePrice: 480000,
    monthsAfterKeys: 0,
    exitType: 'sale', // 'sale' | 'cessao'
    cessaoFee: 2,
    condoIptu: 600,
    commission: 6,
    lienRelease: 600,
    cgRate: 15,
    applyFr2: true,
    singlePropExempt: false,
    singlePropCeiling: 440000,
    reinvest: false,
    // 2.5 Fixed income
    fiNet: 13,
    fiGrossMode: false,
    fiGross: 15,
    fiExempt: false,
    // Calendar
    startMonth: '2026-12',
  })

  /** What a new visitor sees: round numbers that add up, starting this month. */
  const thisMonth = () => {
    const d = new Date()
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
  }
  const DEFAULTS = Object.freeze({
    ...SPEC_EXAMPLE,
    price: 400000,
    downPayment: 20000,
    nMonthly: 36,
    monthlyAmt: 1500,
    nAnnual: 3,
    annualAmt: 5000,
    annualMonths: '12, 24, 36',
    keysPayment: 11000,
    financed: 300000, // 75% of the price, under the SBPE SAC cap
    registry: 6500,
    salePrice: 480000,
    startMonth: thisMonth(),
  })

  const num = (v, fallback = 0) => (typeof v === 'number' && Number.isFinite(v) ? v : fallback)
  const int = (v, fallback = 0) => Math.max(0, Math.round(num(v, fallback)))

  function parseMonthList(s) {
    return String(s || '')
      .split(/[,;\s]+/)
      .map((x) => parseInt(x, 10))
      .filter((x) => Number.isFinite(x) && x >= 0)
  }

  function monthDate(startMonth, t) {
    const m = /^(\d{4})-(\d{1,2})$/.exec(String(startMonth || ''))
    const y = m ? +m[1] : 2026
    const mo = m ? +m[2] - 1 : 11
    return new Date(Date.UTC(y, mo + t, 1))
  }

  const daysBetween = (a, b) => Math.round((b.getTime() - a.getTime()) / 86400000)

  /** Brazilian IR on fixed income, by calendar days held. */
  const irRate = (days) => (days <= 180 ? 0.225 : days <= 360 ? 0.2 : days <= 720 ? 0.175 : 0.15)

  function computeItbi(p, loan) {
    if (p.itbiOverride != null) return { value: num(p.itbiOverride), rule: 'manual' }
    const base = Math.max(p.price, p.valorVenal != null ? p.valorVenal : p.price)
    if (p.firstProperty && base <= p.itbiExemptCeiling) return { value: 0, rule: 'exempt', base }
    if (loan > 0 && p.price <= p.itbiMaxValue) {
      const reduced = Math.min(loan, p.itbiReducedCap)
      return {
        value: (p.itbiReducedRate / 100) * reduced + (p.itbiRate / 100) * (base - reduced),
        rule: 'sfh',
        base,
        reduced,
      }
    }
    return { value: (p.itbiRate / 100) * base, rule: 'general', base }
  }

  /** Build the whole schedule. Everything except the sale price. */
  function build(input) {
    const p = { ...DEFAULTS, ...input }
    // Warnings are codes + numbers; the page turns them into sentences in the chosen language.
    const warnings = []
    const warn = (level, code, args = {}) => warnings.push({ level, code, args })

    const T = Math.max(1, int(p.monthsToKeys, 24))
    const wantsCessao = p.exitType === 'cessao'
    const cessao = wantsCessao && p.structure === 'repasse'
    if (wantsCessao && !cessao) warn('bad', 'cessaoInvalid')
    let H = int(p.monthsAfterKeys)
    if (cessao && H > 0) {
      warn('info', 'cessaoHeld')
      H = 0
    }
    const S = T + H

    const g = eff(num(p.incc))
    const gp = eff(num(p.postKeysIndex))
    const i = p.rateNominal ? num(p.bankRate) / 1200 : eff(num(p.bankRate))
    const tr = num(p.tr) / 100
    const appraisal = p.appraisalValue != null ? p.appraisalValue : p.price
    const appraisalKeysAuto = p.price * Math.pow(1 + g, T)
    const appraisalKeys = p.appraisalAtKeys != null ? p.appraisalAtKeys : appraisalKeysAuto
    const ltv = (p.system === 'SAC' ? num(p.ltvSac) : num(p.ltvPrice)) / 100
    const lineLabel = (LINES[p.line] || { label: p.line }).label

    const rows = []
    for (let t = 0; t <= S; t++)
      rows.push({ t, dev: 0, shortfall: 0, intTR: 0, ins: 0, fee: 0, amort: 0, itbi: 0, registry: 0, apprFee: 0, condo: 0 })
    const basis = [] // capital-gains cost basis items { amt, t, kind }
    const addBasis = (amt, t, kind) => amt > 0 && basis.push({ amt, t, kind })

    // ---- 1. Developer installments -------------------------------------------------
    const corr = (d) => (d <= T ? Math.pow(1 + g, d) : Math.pow(1 + g, T) * Math.pow(1 + gp, d - T))
    const plan = [{ V: num(p.downPayment), d: 0, kind: 'down' }]
    for (let k = 1; k <= int(p.nMonthly); k++) plan.push({ V: num(p.monthlyAmt), d: k, kind: 'monthly' })
    const annualList = parseMonthList(p.annualMonths)
    const nAnnual = int(p.nAnnual)
    if (annualList.length < nAnnual)
      warn('warn', 'annualMismatch', { n: nAnnual, listed: annualList.length })
    annualList.slice(0, nAnnual).forEach((d) => plan.push({ V: num(p.annualAmt), d, kind: 'annual' }))
    plan.push({ V: num(p.keysPayment), d: T, kind: 'keys' })

    let devBalanceGross = 0
    let devAfterSaleCount = 0
    let devPaidAfterKeys = 0
    let devPaidAfterKeysCount = 0
    for (const it of plan) {
      if (it.V <= 0) continue
      if (it.d <= S) {
        const amt = it.V * corr(it.d)
        rows[it.d].dev += amt
        addBasis(amt, it.d, 'developer')
        if (it.d > T) {
          devPaidAfterKeys += amt
          devPaidAfterKeysCount++
        }
      } else {
        devBalanceGross += it.V * corr(S)
        devAfterSaleCount++
      }
    }
    const settled = !cessao && p.settleAtSale
    const devBalance = devBalanceGross * (settled ? 1 - num(p.earlyDiscount) / 100 : 1)
    addBasis(devBalance, S, 'developer balance')

    // ---- 2-4. Bank ------------------------------------------------------------------
    let loan = 0 // principal of the bank loan
    let assumed = 0 // balance assumed by the buyer under cessão
    let shortfall = 0
    let owedAtKeys = 0
    let loanStart = null
    let dfiBase = appraisal
    let constructionMonths = 0

    const chargeOn = (t, D) => {
      const r = rows[t]
      if (p.allIn) {
        const c = D * eff(num(p.allInRate))
        r.intTR += c
        addBasis(c, t, 'interest')
      } else {
        const it = D * (i + tr)
        r.intTR += it
        addBasis(it, t, 'interest')
        r.ins += (D * num(p.mip)) / 100 + (appraisal * num(p.dfi)) / 100
        r.fee += num(p.adminFee)
      }
      constructionMonths++
    }

    if (p.structure === 'associativo') {
      loan = num(p.financed)
      addBasis(loan, 0, 'financed principal')
      const p0 = Math.min(1, Math.max(0, num(p.releasedAtSigning) / 100))
      const rel = (t) => {
        if (T <= 1) return 1
        const x = (t - 1) / (T - 1)
        const f = p.releaseCurve === 's' ? x * x * (3 - 2 * x) : x
        return Math.min(1, p0 + (1 - p0) * f)
      }
      for (let t = 1; t <= T; t++) chargeOn(t, loan * rel(t))
      const k = int(p.averbacaoMonths)
      for (let t = T + 1; t <= Math.min(T + k, S); t++) chargeOn(t, loan)
      loanStart = T + k + 1
    } else {
      owedAtKeys = num(p.financed) * Math.pow(1 + g, T)
      if (cessao) {
        assumed = owedAtKeys
        addBasis(assumed, S, 'balance assumed by buyer')
      } else {
        loan = Math.min(owedAtKeys, ltv * appraisalKeys)
        shortfall = owedAtKeys - loan
        rows[T].shortfall += shortfall
        addBasis(loan, T, 'financed principal')
        addBasis(shortfall, T, 'developer')
        loanStart = T + 1
        dfiBase = appraisalKeys
      }
      if (int(p.averbacaoMonths) > 0)
        warn('info', 'averbRepasse')
    }

    const amortStep = (B, idx) => {
      const Bc = B * (1 + tr)
      const trC = Bc - B
      const rem = Math.max(1, int(p.term, 420) - idx)
      const interest = Bc * i
      let A
      if (p.system === 'SAC') A = Bc / rem
      else {
        const pmt = i > 0 ? (Bc * i) / (1 - Math.pow(1 + i, -rem)) : Bc / rem
        A = pmt - interest
      }
      const mip = (Bc * num(p.mip)) / 100
      const dfi = (dfiBase * num(p.dfi)) / 100
      return { Bc, trC, interest, A, mip, dfi, fee: num(p.adminFee), next: Bc - A }
    }

    let bankBalance = 0
    let firstInstallment = null
    if (loanStart !== null && loan > 0) {
      const s0 = amortStep(loan, 0)
      firstInstallment = s0.interest + s0.A + s0.mip + s0.dfi + s0.fee
      let B = loan
      for (let t = loanStart; t <= S; t++) {
        const s = amortStep(B, t - loanStart)
        const r = rows[t]
        r.intTR += s.interest
        r.amort += s.A
        r.ins += s.mip + s.dfi
        r.fee += s.fee
        addBasis(s.interest + s.trC, t, 'interest')
        B = s.next
      }
      bankBalance = B
    }

    // ---- 4b. Condo + IPTU after keys -----------------------------------------------
    for (let t = T + 1; t <= S; t++) rows[t].condo += num(p.condoIptu)

    // ---- 5. Acquisition costs ------------------------------------------------------
    let itbi = { value: 0, rule: 'none' }
    let registry = 0
    let apprFee = 0
    let acqMonth = null
    if (!cessao) {
      acqMonth =
        p.acqTiming === 'month0' ? 0 : p.acqTiming === 'keys' ? T : p.structure === 'associativo' ? 0 : T
      itbi = computeItbi(p, loan)
      registry = num(p.registry) * (p.registryDiscount ? 0.5 : 1)
      apprFee = num(p.appraisalFee)
      const bankMonth = p.structure === 'associativo' ? 0 : T
      rows[acqMonth].itbi += itbi.value
      rows[acqMonth].registry += registry
      rows[bankMonth].apprFee += apprFee
      addBasis(itbi.value, acqMonth, 'ITBI')
      addBasis(registry, acqMonth, 'registry')
      addBasis(apprFee, bankMonth, 'appraisal')
    }

    // ---- 6. Scenario B ------------------------------------------------------------
    const r = eff(num(p.fiNet))
    const rg = eff(num(p.fiGross))
    const dates = rows.map((_, t) => monthDate(p.startMonth, t))
    /** Value at month `to` of R$1 deposited at month `from`. */
    const growth = (from, to, rate) => {
      const n = to - from
      if (rate === 0) return 1
      if (!p.fiGrossMode) return Math.pow(1 + r, n)
      const gain = Math.pow(1 + rg, n) - 1
      const tax = p.fiExempt ? 0 : irRate(daysBetween(dates[from], dates[to]))
      return 1 + gain * (1 - tax)
    }

    let cash = 0
    let fvB = 0
    for (const row of rows) {
      row.date = dates[row.t]
      row.bank = row.intTR + row.ins + row.fee + row.amort
      row.acq = row.itbi + row.registry + row.apprFee
      row.devTotal = row.dev + row.shortfall
      row.total = row.devTotal + row.bank + row.acq + row.condo
      row.factor = growth(row.t, S, 1)
      row.fv = row.total * row.factor
      row.opp = row.fv - row.total
      cash += row.total
      fvB += row.fv
    }
    // Cumulative curves for the chart
    const curve = rows.map((row) => {
      let invested = 0
      let valueB = 0
      for (let s = 0; s <= row.t; s++) {
        invested += rows[s].total
        valueB += rows[s].total * growth(s, row.t, 1)
      }
      return { t: row.t, invested, valueB }
    })

    // ---- 8. Cost basis + FR2 ------------------------------------------------------
    const basisTotal = basis.reduce((a, b) => a + b.amt, 0)
    const fr2 = basisTotal > 0 ? basis.reduce((a, b) => a + b.amt / Math.pow(1.0035, S - b.t), 0) / basisTotal : 1

    const lien = !cessao && loan > 0 ? num(p.lienRelease) : 0
    const cessaoFee = cessao ? (num(p.cessaoFee) / 100) * p.price : 0
    const debtAtSale = bankBalance + assumed + devBalance

    // ---- 7. Exit at price P --------------------------------------------------------
    function exitAt(P) {
      const commission = (P * num(p.commission)) / 100
      const gain = P - commission - basisTotal
      let tax = (num(p.cgRate) / 100) * (p.applyFr2 ? fr2 : 1) * Math.max(0, gain)
      let exemption = null
      if (p.reinvest) exemption = 'reinvest'
      else if (p.singlePropExempt && P <= num(p.singlePropCeiling)) exemption = 'single'
      if (exemption) tax = 0
      const net = P - commission - tax - debtAtSale - lien - cessaoFee
      return { P, commission, gain, tax, exemption, net }
    }

    // Consistency check of the payment plan
    const planSum =
      num(p.downPayment) +
      int(p.nMonthly) * num(p.monthlyAmt) +
      Math.min(nAnnual, annualList.length) * num(p.annualAmt) +
      num(p.keysPayment) +
      num(p.financed)

    return {
      p, T, S, H, g, gp, i, tr, r, ltv, lineLabel, cessao, rows, curve, plan,
      cash, fvB, fv0: cash, basis, basisTotal, fr2, lien, cessaoFee, debtAtSale,
      bankBalance, assumed, devBalance, devBalanceGross, devAfterSaleCount, devPaidAfterKeys, devPaidAfterKeysCount,
      loan, shortfall, owedAtKeys, loanStart, firstInstallment, constructionMonths,
      appraisal, appraisalKeys, appraisalKeysAuto, itbi, registry, apprFee, acqMonth,
      planSum, planDiff: p.price - planSum,
      exitAt, warnings,
    }
  }

  /** Bisection between R$100k and R$5M, to R$1. `target` is the value the net proceeds must reach. */
  function breakEven(sim, target) {
    let lo = 100000
    let hi = 5000000
    const f = (P) => sim.exitAt(P).net - target
    if (f(hi) < 0) return { value: null, above: true }
    if (f(lo) >= 0) return { value: lo, below: true }
    while (hi - lo > 1) {
      const mid = (lo + hi) / 2
      if (f(mid) >= 0) hi = mid
      else lo = mid
    }
    return { value: (lo + hi) / 2 }
  }

  /** Monthly IRR of a flow vector (index = month), by bisection. Returns null if no sign change. */
  function irr(flows) {
    const npv = (rate) => flows.reduce((a, f, t) => a + f / Math.pow(1 + rate, t), 0)
    let lo = -0.99
    let hi = 1
    let flo = npv(lo)
    const fhi = npv(hi)
    if (!Number.isFinite(flo) || flo * fhi > 0) return null
    for (let k = 0; k < 200; k++) {
      const mid = (lo + hi) / 2
      const fm = npv(mid)
      if (fm * flo > 0) {
        lo = mid
        flo = fm
      } else hi = mid
      if (hi - lo < 1e-12) break
    }
    return (lo + hi) / 2
  }
  const annualize = (m) => (m == null ? null : Math.pow(1 + m, 12) - 1)

  /** Full simulation: schedule, break-evens, comparison at the expected price, IRR and warnings. */
  function simulate(input) {
    const sim = build(input)
    const { p, S } = sim
    const be = breakEven(sim, sim.fvB)
    const be0 = breakEven(sim, sim.fv0)
    const at = sim.exitAt(num(p.salePrice))
    const inccPrice = p.price * Math.pow(1 + sim.g, S)

    const flowsA = sim.rows.map((r) => -r.total)
    flowsA[S] += at.net
    const flowsB = sim.rows.map((r) => -r.total)
    flowsB[S] += sim.fvB
    const irrFlip = annualize(irr(flowsA))
    const irrFi = annualize(irr(flowsB))

    const out = {
      ...sim,
      breakEven: be,
      breakEvenZero: be0,
      at,
      diff: at.net - sim.fvB,
      inccPrice,
      irrFlip,
      irrFi,
    }
    addWarnings(out)
    return out
  }

  function addWarnings(s) {
    const { p, warnings } = s
    const warn = (level, code, args = {}) => warnings.push({ level, code, args })
    const sys = p.system
    if (p.structure === 'associativo') {
      const pct = p.financed / p.price
      if (pct > s.ltv + 1e-9)
        warn('bad', 'ltvOver', { pct, line: s.lineLabel, sys, cap: s.ltv, maxLoan: s.ltv * Math.min(p.price, s.appraisal) })
    } else if (!s.cessao && s.shortfall > 0.5) {
      warn('warn', 'repasseGap', { owed: s.owedAtKeys, cap: s.ltv, appraisal: s.appraisalKeys, loan: s.loan, gap: s.shortfall })
    }
    if (p.line === 'MCMV' && p.price > p.mcmvPriceLimit)
      warn('bad', 'mcmvPrice', { limit: p.mcmvPriceLimit, price: p.price })
    if (s.devAfterSaleCount > 0)
      warn('warn', 'devAfterSale', {
        count: s.devAfterSaleCount,
        amount: s.devBalance,
        mode: s.cessao ? 'cessao' : p.settleAtSale ? 'settle' : 'buyer',
      })
    if (s.devPaidAfterKeysCount > 0)
      warn('info', 'devAfterKeys', { count: s.devPaidAfterKeysCount, amount: s.devPaidAfterKeys, index: p.postKeysIndex })
    if (p.line === 'MCMV' && s.firstInstallment != null) {
      const income = s.firstInstallment / 0.3
      if (income > p.mcmvIncomeLimit)
        warn('bad', 'mcmvIncome', { sys, inst: s.firstInstallment, income, limit: p.mcmvIncomeLimit })
    }
    if (p.salePrice <= p.singlePropCeiling && !p.singlePropExempt && !p.reinvest && s.at.tax > 0)
      warn('info', 'singleProp', { ceiling: p.singlePropCeiling })
    if (s.breakEven.above) warn('bad', 'beAbove5M')
    else if (s.breakEven.value > p.salePrice)
      warn('bad', 'beAboveExpected', { be: s.breakEven.value, price: p.salePrice })
    if (Math.abs(s.planDiff) > 1) warn('warn', 'planMismatch', { sum: s.planSum, diff: s.planDiff })
    if (s.cessao) warn('info', 'cessaoConsent')
  }

  // ---------------------------------------------------------------------------------
  // Sensitivity
  const bePrice = (input) => {
    const sim = build(input)
    return breakEven(sim, sim.fvB).value
  }

  function tornado(p) {
    const base = bePrice(p)
    // key names the input; lowSet/highSet are the raw settings tried (the page formats them).
    const v = (key, lowSet, low, highSet, high) => ({
      key,
      lowSet,
      highSet,
      low: bePrice({ ...p, ...low }),
      high: bePrice({ ...p, ...high }),
    })
    const assocExit = p.exitType === 'cessao' ? { exitType: 'sale' } : {}
    const fiBase = p.fiGrossMode ? p.fiGross : p.fiNet
    const held = int(p.monthsAfterKeys)
    const items = [
      v('fi', fiBase - 3, { fiNet: p.fiNet - 3, fiGross: p.fiGross - 3 }, fiBase + 3, { fiNet: p.fiNet + 3, fiGross: p.fiGross + 3 }),
      v('incc', 0, { incc: 0 }, p.incc + 2, { incc: p.incc + 2 }),
      v('bankRate', p.bankRate - 1, { bankRate: p.bankRate - 1 }, p.bankRate + 1, { bankRate: p.bankRate + 1 }),
      v('tr', 0, { tr: 0 }, p.tr + 0.05, { tr: p.tr + 0.05 }),
      v('commission', 4, { commission: 4 }, 8, { commission: 8 }),
      v('released', 10, { releasedAtSigning: 10 }, 60, { releasedAtSigning: 60 }),
      v('monthsAfter', 0, { monthsAfterKeys: 0 }, held + 3, { monthsAfterKeys: held + 3 }),
      v('line', 'SBPE', { line: 'SBPE', ...lineFields('SBPE') }, 'MCMV', { line: 'MCMV', ...lineFields('MCMV') }),
      v('structure', 'associativo', { structure: 'associativo', ...assocExit }, 'repasse', { structure: 'repasse' }),
    ]
    items.forEach((it) => {
      const vals = [it.low, it.high, base].filter((x) => x != null)
      it.range = Math.max(...vals) - Math.min(...vals)
    })
    items.sort((a, b) => b.range - a.range)
    return { base, items }
  }

  function grid(p) {
    const fi = [10, 13, 15]
    const incc = [0, 4, 6]
    const fiKey = p.fiGrossMode ? 'fiGross' : 'fiNet'
    return {
      fi,
      incc,
      fiKey,
      cells: incc.map((ic) => fi.map((f) => bePrice({ ...p, incc: ic, [fiKey]: f }))),
      bankRates: [10, 11, 12].map((br) => ({ rate: br, value: bePrice({ ...p, bankRate: br }) })),
      systems: ['SAC', 'PRICE'].map((sys) => ({ system: sys, value: bePrice({ ...p, system: sys }) })),
    }
  }

  function lineFields(name) {
    const l = LINES[name]
    return { bankRate: l.bankRate, rateNominal: l.rateNominal, ltvSac: l.ltvSac, ltvPrice: l.ltvPrice }
  }


  // ---------------------------------------------------------------------------------
  // Test cases (section 6 of the spec)
  const TEST1_INPUTS = {
    ...SPEC_EXAMPLE,
    structure: 'associativo',

  // ---------- State ----------
  function sanitize(saved) {
    const s = { ...D }
    if (!saved || typeof saved !== 'object') return s
    for (const k of Object.keys(D)) {
      if (!(k in saved)) continue
      const v = saved[k]
      const def = D[k]
      if (def === null ? v === null || typeof v === 'number' : typeof v === typeof def) s[k] = v
    }
    return s
  }
  // Simulations: { draft: inputs, list: [{ id, name, inputs, at }], defaultId, currentId }
  // currentId null means the Draft is selected. Edits save automatically to whichever is selected.
  const SAVES_KEY = 'financing-simulator:saves:v1'
  const saves = (() => {
    const raw = store.get(SAVES_KEY)
    const list = raw && Array.isArray(raw.list)
      ? raw.list.filter((x) => x && typeof x.id === 'string' && typeof x.name === 'string' && x.inputs && typeof x.inputs === 'object')
      : []
    const has = (id) => list.some((x) => x.id === id)
    const defaultId = has(raw && raw.defaultId) ? raw.defaultId : null
    const mine = list.find((x) => x.id === defaultId)
    const draft = raw && raw.draft && typeof raw.draft === 'object' ? sanitize(raw.draft) : sanitize(mine ? mine.inputs : D)
    return { draft, list, defaultId, currentId: has(raw && raw.currentId) ? raw.currentId : null }
  })()
  const findSave = (id) => saves.list.find((x) => x.id === id) || null
  const DRAFT_NAMES = ['draft', 'rascunho']
  const nameTaken = (name) => {
    const n = name.trim().toLowerCase()
    return DRAFT_NAMES.includes(n) || saves.list.some((x) => x.name.toLowerCase() === n)
  }
  const persistSaves = () => store.set(SAVES_KEY, saves)

  const cur0 = findSave(saves.currentId)
  let state = sanitize(cur0 ? cur0.inputs : saves.draft)
  let openState = store.get(OPEN_KEY) || {}
  let sim = null

  // ---------- Static text + language toggle ----------
  function renderStatic() {
    document.documentElement.lang = L('en', 'pt-BR')

    ms.setAttribute('data-show', L('Show', 'Mostrar'))
    ms.setAttribute('data-hide', L('Hide', 'Ocultar'))

    renderResetLabel()
  }
  function renderResetLabel() {

  document.querySelector('.lang').addEventListener('click', (e) => {
    const b = e.target.closest('[data-lang]')

    lang = b.dataset.lang
    store.set(LANG_KEY, lang)
    renderStatic()
    renderInputs()
    recompute()
    if (!$('#tests').hidden) renderTests()
  })

  // ---------- Inputs ----------
  const inputsEl = $('#inputs')
  const tipBtn = (id) => `<button type="button" class="tip" aria-expanded="false" aria-controls="${id}" data-tip-for="${id}" aria-label="${L('More information', 'Mais informações')}">i</button>`

  function fieldHtml(f) {
    if (f.t === 'sub') return `<div class="sub">${esc(tx(f.label))}</div>`
    if (f.t === 'html') return `<div id="x-${f.id}"></div>`
    const id = 'f-' + f.k
    const hint = f.hint ? `<span class="hint">${esc(tx(f.hint))}</span>` : ''
    const calc = f.calc ? `<span class="calc" id="c-${f.k}"></span>` : ''
    const wrapAttr = `data-field="${f.k}"`
    const label = esc(tx(f.label))
    if (f.t === 'check')
      return `<label class="check" ${wrapAttr}><input type="checkbox" id="${id}" data-k="${f.k}"><span>${label}</span></label>`
    if (f.t === 'seg') {
      const btns = f.opts.map(([v, l]) => `<button type="button" role="radio" data-v="${String(v)}">${esc(tx(l))}</button>`).join('')
      return `<div class="field${f.wide ? ' wide' : ''}" ${wrapAttr}><span class="label" id="l-${f.k}">${label}</span><div class="seg" role="radiogroup" aria-labelledby="l-${f.k}" data-seg="${f.k}">${btns}</div>${calc}${hint}</div>`
    }
    const type = f.t === 'month' ? 'month' : 'text'
    const mode = f.t === 'int' ? 'numeric' : f.t === 'month' || f.t === 'text' ? 'text' : 'decimal'
    const pre = f.t === 'money' ? '<span class="pre">R$</span>' : ''
    const suf = f.suf ? `<span class="suf">${esc(tx(SUF[f.suf]))}</span>` : ''
    const autoLink = f.auto ? ` <button type="button" class="linkbtn" data-auto="${f.k}" hidden>${L('use auto', 'usar automático')}</button>` : ''
    return `<div class="field" ${wrapAttr}><label class="label" for="${id}">${label}${autoLink}</label><span class="inbox">${pre}<input id="${id}" data-k="${f.k}" type="${type}" inputmode="${mode}" autocomplete="off" class="${f.t === 'text' ? 'text' : ''}">${suf}</span>${calc}${hint}</div>`
  }

  function savesCardHtml() {
    const open = 'saves' in openState ? openState.saves : true
    return `<details class="group" data-sec="saves"${open ? ' open' : ''}>
      <summary><span>${L('My simulations', 'Minhas simulações')}</span><span class="sum-note" id="sn-saves"></span></summary>
      <div class="fields">
        <ul class="save-list" id="save-list"></ul>
        <form class="save-form" id="save-form" autocomplete="off">
          <span class="inbox"><input id="save-name" class="text" maxlength="60" aria-label="${L('Name for a new simulation', 'Nome da nova simulação')}" placeholder="${L('New name, e.g. Pinheiros 2BR', 'Novo nome, ex.: Pinheiros 2 dorms')}"></span>
          <button type="submit" class="btn primary" id="save-btn"></button>
        </form>
        <span class="hint" id="save-hint"></span>
      </div>
    </details>`
  }

  const draftName = () => L('Draft', 'Rascunho')

  function renderSaves() {
    const cur = findSave(saves.currentId)
    const sn = $('#sn-saves')
    if (sn) sn.textContent = cur ? cur.name : draftName()
    const list = $('#save-list')
    if (!list) return
    const draftRow = `<li class="save-row draft${cur ? '' : ' current'}" data-draft>
        <button type="button" class="name" data-act="load" title="${L('Open', 'Abrir')}"><span>${draftName()}</span><span class="tag">${L('scratch pad', 'para testar à vontade')}</span></button>
        <button type="button" class="icon-btn" data-act="reset-draft" title="${L('Fill with my default', 'Preencher com meu padrão')}">${L('Reset', 'Restaurar')}</button>
      </li>`
    list.innerHTML = draftRow + saves.list.map((x) => {
      const isCur = x.id === saves.currentId
      const isDef = x.id === saves.defaultId
      return `<li class="save-row${isCur ? ' current' : ''}" data-id="${x.id}">
        <button type="button" class="name" data-act="load" title="${L('Open', 'Abrir')}"><span>${esc(x.name)}</span>${isDef ? `<span class="tag">${L('default', 'padrão')}</span>` : ''}</button>
        <button type="button" class="icon-btn${isDef ? ' on' : ''}" data-act="default" aria-pressed="${isDef}" title="${L('Use as my default', 'Usar como meu padrão')}" aria-label="${L('Use as my default', 'Usar como meu padrão')}">${isDef ? '★' : '☆'}</button>
        <button type="button" class="icon-btn" data-act="rename" title="${L('Rename', 'Renomear')}" aria-label="${L('Rename', 'Renomear')}">✎</button>
        <button type="button" class="icon-btn" data-act="delete" title="${L('Delete', 'Excluir')}" aria-label="${L('Delete', 'Excluir')}">✕</button>
      </li>`
    }).join('')
    $('#save-hint').textContent = L(
      'Changes save automatically to the selected simulation. Use the draft to try things out without touching your saved ones. ★ marks your default: Reset fills the draft with it.',
      'As alterações são salvas automaticamente na simulação selecionada. Use o rascunho para testar sem mexer nas suas simulações salvas. ★ marca o seu padrão: Restaurar preenche o rascunho com ele.')
    renderSaveBtn()
    renderResetLabel()
  }

  function renderSaveBtn() {
    const input = $('#save-name')
    const btn = $('#save-btn')
    if (!input || !btn) return
    const name = input.value.trim()
    const taken = !!name && nameTaken(name)
    btn.disabled = !name || taken
    btn.textContent = taken ? L('Name in use', 'Nome já existe') : L('Save as new', 'Salvar como nova')
  }

  function renderInputs() {
    inputsEl.innerHTML = savesCardHtml() + SECTIONS.map((sec) => {
      const open = sec.id in openState ? openState[sec.id] : sec.open
      return `<details class="group" data-sec="${sec.id}"${open ? ' open' : ''}><summary><span>${esc(tx(sec.title))}</span><span class="sum-note" id="sn-${sec.id}"></span></summary><div class="fields">${sec.fields.map(fieldHtml).join('')}</div></details>`
    }).join('')
    syncInputs()
    renderSaves()
  }

  /** Switch to a saved simulation, or to the draft when id is null. */
  function openSim(id) {
    const item = findSave(id)
    saves.currentId = item ? item.id : null
    state = sanitize(item ? item.inputs : saves.draft)
    persistSaves()
    renderInputs()
    recompute()
  }

  /** Overwrite the draft with these inputs and switch to it (Reset, test cases). */
  function fillDraft(inputs) {
    saves.draft = sanitize(inputs)
    openSim(null)
  }
  const myDefaultInputs = () => {
    const mine = findSave(saves.defaultId)
    return mine ? mine.inputs : D
  }

  function display(v, f) {
    if (v == null) return ''
    if (f.t === 'money') return v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    if (f.t === 'int') return String(v)
    if (f.t === 'pct') return nfmt(v)
    return String(v)
  }

  function syncInputs() {
    for (const f of Object.values(FIELDS)) {
      if (f.t === 'seg') {
        inputsEl.querySelectorAll(`[data-seg="${f.k}"] button`).forEach((b) => b.setAttribute('aria-checked', String(b.dataset.v === String(state[f.k]))))
        continue
      }
      const el = document.getElementById('f-' + f.k)
      if (!el) continue
      if (f.t === 'check') el.checked = !!state[f.k]
      else if (document.activeElement !== el) {
        el.value = display(state[f.k], f)
        el.removeAttribute('aria-invalid')
      }
    }
    updateVisibility()
  }

  function updateVisibility() {
    for (const f of Object.values(FIELDS)) {
      const wrap = inputsEl.querySelector(`[data-field="${f.k}"]`)
      if (wrap) wrap.hidden = f.show ? !f.show(state) : false
      if (f.auto) {
        const link = inputsEl.querySelector(`[data-auto="${f.k}"]`)
        if (link) link.hidden = state[f.k] == null
      }
    }
  }

  const decode = (v) => (v === 'true' ? true : v === 'false' ? false : v)

  inputsEl.addEventListener('input', (e) => {
    const el = e.target
    const k = el.dataset && el.dataset.k
    if (!k) return
    const f = FIELDS[k]
    let v
    if (f.t === 'check') v = el.checked
    else if (f.t === 'text' || f.t === 'month') {
      v = el.value
      if (f.t === 'month' && !/^\d{4}-\d{2}$/.test(v)) return
    } else {
      const parsed = parseNum(el.value, f.t === 'money')
      if (parsed === null) {
        if (!f.auto) return el.setAttribute('aria-invalid', 'true')
        v = null
      } else if (Number.isNaN(parsed) || (f.min != null && parsed < f.min) || (f.t !== 'pct' && parsed < 0)) {
        return el.setAttribute('aria-invalid', 'true')
      } else v = f.t === 'int' ? Math.round(parsed) : parsed
    }
    el.removeAttribute('aria-invalid')
    state[k] = v
    changed()
  })
  inputsEl.addEventListener('focusout', (e) => {
    const el = e.target
    const k = el.dataset && el.dataset.k
    if (!k) return
    const f = FIELDS[k]
    if (f.t === 'check' || f.t === 'month' || f.t === 'text') return
    el.value = display(state[k], f)
    el.removeAttribute('aria-invalid')
  })
  inputsEl.addEventListener('click', (e) => {
    const b = e.target.closest('.seg button')
    if (b) {
      const k = b.closest('[data-seg]').dataset.seg
      state[k] = decode(b.dataset.v)
      syncInputs()
      return changed()
    }
    const pre = e.target.closest('[data-line]')
    if (pre) {
      const name = pre.dataset.line
      Object.assign(state, { line: name }, E.lineFields(name))
      syncInputs()
      return changed()
    }
    const a = e.target.closest('[data-auto]')
    if (a) {
      state[a.dataset.auto] = null
      syncInputs()
      return changed()
    }
    const t = e.target.closest('[data-tip-for]')
    if (t) {
      const body = document.getElementById(t.dataset.tipFor)
      if (body) {
        body.hidden = !body.hidden
        t.setAttribute('aria-expanded', String(!body.hidden))
      }
    }
  })
  inputsEl.addEventListener('toggle', (e) => {
    const d = e.target
    if (d.dataset && d.dataset.sec) {
      openState[d.dataset.sec] = d.open
      store.set(OPEN_KEY, openState)
    }
  }, true)

  $('#reset').addEventListener('click', () => {
    fillDraft(myDefaultInputs())
  })

  // ---------- Saved simulations ----------
  inputsEl.addEventListener('input', (e) => {
    if (e.target.id === 'save-name') renderSaveBtn()
  })
  inputsEl.addEventListener('submit', (e) => {
    if (e.target.id !== 'save-form') return
    e.preventDefault()
    const input = $('#save-name')
    const name = input.value.trim().slice(0, 60)
    if (!name) return
    if (nameTaken(name)) return
    const item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, inputs: { ...state }, at: Date.now() }
    saves.list.push(item)
    saves.currentId = item.id
    persistSaves()
    input.value = ''
    renderSaves()
  })

  let armedDelete = null
  let armTimer = null
  inputsEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]')
    if (!b) return
    const row = b.closest('.save-row')
    const act = b.dataset.act
    if (row.hasAttribute('data-draft')) {
      if (act === 'load') return openSim(null)
      if (act === 'reset-draft') return fillDraft(myDefaultInputs())
      return
    }
    const item = findSave(row.dataset.id)
    if (!item) return
    if (act === 'load') return openSim(item.id)
    if (act === 'default') {
      saves.defaultId = saves.defaultId === item.id ? null : item.id
      persistSaves()
      return renderSaves()
    }
    if (act === 'delete') {
      if (armedDelete !== item.id) {
        armedDelete = item.id
        b.textContent = L('Delete?', 'Excluir?')
        b.classList.add('armed')
        clearTimeout(armTimer)
        armTimer = setTimeout(() => { armedDelete = null; renderSaves() }, 3000)
        return
      }
      armedDelete = null
      clearTimeout(armTimer)
      saves.list = saves.list.filter((x) => x.id !== item.id)
      if (saves.defaultId === item.id) saves.defaultId = null
      if (saves.currentId === item.id) return openSim(null)
      persistSaves()
      return renderSaves()
    }
    if (act === 'rename') {
      const nameBtn = row.querySelector('.name')
      const field = document.createElement('input')
      field.className = 'rename'
      field.maxLength = 60
      field.value = item.name
      field.setAttribute('aria-label', L('New name', 'Novo nome'))
      nameBtn.replaceWith(field)
      field.focus()
      field.select()
      let done = false
      const finish = (commit) => {
        if (done) return
        done = true
        const name = field.value.trim().slice(0, 60)
        if (commit && name && (name.toLowerCase() === item.name.toLowerCase() || !nameTaken(name))) {
          item.name = name
          persistSaves()
        }
        renderSaves()
      }
      field.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); finish(true) }
        if (ev.key === 'Escape') finish(false)
      })
      field.addEventListener('blur', () => finish(true))
    }
  })

  // ---------- Recompute ----------
  /** Every edit saves to the selected simulation (or the draft). */
  function changed() {
    const cur = findSave(saves.currentId)
    if (cur) Object.assign(cur, { inputs: { ...state }, at: Date.now() })
    else saves.draft = { ...state }
    persistSaves()
    updateVisibility()
    recompute()
  }

  function recompute() {
    sim = E.simulate(state)
    sim.itbiAuto = E.computeItbi({ ...sim.p, itbiOverride: null }, sim.loan).value
    renderSummary(sim)
    renderWarnings(sim)
    renderCalcs(sim)
    drawCumulative(sim)
    renderBreakdown(sim)
    drawTornado(sim, E.tornado(state))
    renderGrid(sim)
    renderMonthly(sim)
    renderBar(sim)
  }

  // ---------- Summary ----------
  const winnerText = (buyWins) => (buyWins ? L('Buying', 'Comprar') : L('Fixed income', 'Renda fixa'))
  function renderSummary(s) {
    const net = s.at.net
    const fv = s.fvB
    const buyWins = s.diff > 0
    const max = Math.max(net, fv, 1)
    const w = (v) => Math.max(0, (v / max) * 100)
    const be = s.breakEven
    const beText = be.above ? L('Above R$ 5 mi', 'Acima de R$ 5 mi') : be.below ? L('Below R$ 100 mil', 'Abaixo de R$ 100 mil') : brl0(be.value)
    const beUp = ok(be.value) ? be.value / s.p.price - 1 : null
    const be0 = s.breakEvenZero.value
    const realUp = ok(be.value) ? be.value / s.inccPrice - 1 : null
    const sm = monthLabel(E.monthDate(s.p.startMonth, s.S))
    $('#summary').innerHTML = `
      <div class="hero">
        <div class="hero-head">
          <p class="eyebrow">${L(`Selling at ${brl0(s.p.salePrice)} in ${sm} (month ${s.S})`, `Vendendo por ${brl0(s.p.salePrice)} em ${sm} (mês ${s.S})`)}</p>
          <span class="chip"><span class="dot ${buyWins ? 'buy' : 'fi'}"></span>${L(`${winnerText(buyWins)} wins`, `${winnerText(buyWins)} vence`)}</span>
        </div>
        <p class="headline">${L(`${winnerText(buyWins)} wins by ${brl0(Math.abs(s.diff))}`, `${winnerText(buyWins)} vence por ${brl0(Math.abs(s.diff))}`)}</p>
        <div class="vsbars">
          ${vsRow('buy', L('Net sale proceeds', 'Valor líquido da venda'), net, w(net))}
          ${vsRow('fi', L('Fixed-income value', 'Valor na renda fixa'), fv, w(fv))}
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="k">${L('Break-even resale price', 'Preço de revenda de equilíbrio')}</span>
          <span class="v">${beText}</span>
          <span class="s">${L(`<b>${spct(beUp)}</b> over the purchase price`, `<b>${spct(beUp)}</b> sobre o preço de compra`)}</span>
          <span class="s">${L('With 0% fixed income', 'Com renda fixa a 0%')}: ${brl0(be0)}</span>
        </div>
        <div class="stat">
          <span class="k">${L('Price corrected by INCC only', 'Preço corrigido só pelo INCC')}</span>
          <span class="v">${brl0(s.inccPrice)}</span>
          <span class="s">${L('Real appreciation needed above it', 'Valorização real necessária acima dele')}: <b>${spct(realUp)}</b></span>
        </div>
        <div class="stat">
          <span class="k">${L('Flip return per year (IRR)', 'Retorno anual da revenda (TIR)')}</span>
          <span class="v">${s.irrFlip == null ? '—' : spct(s.irrFlip)}</span>
          <span class="s">${L('Fixed income', 'Renda fixa')}: <b>${pct(s.irrFi)}</b> ${L('a year', 'ao ano')}${s.p.fiGrossMode ? L(' after IR', ' após IR') : ''}</span>
          ${s.irrFlip == null ? `<span class="s">${L('No meaningful IRR for these flows.', 'Não há TIR com sentido para esses fluxos.')}</span>` : ''}
        </div>
      </div>`
  }
  function vsRow(cls, label, v, width) {
    const inside = width > 55
    const pos = inside ? `right:calc(${100 - width}% + 8px);color:#fff` : `left:calc(${width}% + 8px)`
    return `<div class="vsrow"><span class="lab"><span class="dot ${cls}"></span>${label}</span><div class="track"><div class="fill ${cls}" style="width:${width}%"></div><span class="amt" style="${pos}">${brl0(v)}</span></div></div>`
  }

  function renderBar(s) {
    const buyWins = s.diff > 0
    $('#bar-in').innerHTML = `<span>${L('Break-even', 'Equilíbrio')} <b>${s.breakEven.value ? brl0(s.breakEven.value) : '—'}</b></span><span><span class="dot ${buyWins ? 'buy' : 'fi'}"></span> ${L(`<b>${winnerText(buyWins)}</b> wins by`, `<b>${winnerText(buyWins)}</b> vence por`)} <b>${brl0(Math.abs(s.diff))}</b></span>`
  }
  try {
    const io = new IntersectionObserver((entries) => {
      $('#bar').classList.toggle('show', !entries[0].isIntersecting)
    })
    io.observe($('#summary'))
  } catch (e) { /* no IntersectionObserver: bar stays hidden */ }

  // ---------- Warnings ----------
  function renderWarnings(s) {
    const order = { bad: 0, warn: 1, info: 2 }
    const label = { bad: L('Problem', 'Problema'), warn: L('Check', 'Atenção'), info: L('Note', 'Nota') }
    const list = [...s.warnings].sort((a, b) => order[a.level] - order[b.level])
    $('#warnings').innerHTML = list.map((w) => {
      const text = WARN[w.code] ? WARN[w.code](w.args || {}) : w.code
      return `<div class="warn ${w.level}"><span class="sev">${label[w.level]}</span><span>${esc(text)}</span></div>`
    }).join('')
  }

  // ---------- Inline calculations next to inputs ----------
  function setHtml(id, html) {
    const el = document.getElementById(id)
    if (el) el.innerHTML = html
  }
  function renderCalcs(s) {
    const p = s.p
    for (const f of Object.values(FIELDS)) {
      if (!f.auto) continue
      const el = document.getElementById('f-' + f.k)
      if (el) el.placeholder = L('auto: ', 'auto: ') + display(f.auto(s), f)
    }
    const fpct = p.financed / p.price
    const over = p.structure === 'associativo' && fpct > s.ltv + 1e-9
    const fc = document.getElementById('c-financed')
    if (fc) {
      fc.className = 'calc' + (over ? ' bad' : '')
      fc.textContent = L(`${pct(fpct)} of the price · ${s.lineLabel} ${p.system} cap ${pct(s.ltv, 0)}`, `${pct(fpct)} do preço · cota ${s.lineLabel} ${p.system} de ${pct(s.ltv, 0)}`) +
        (p.structure === 'repasse' && !s.cessao ? L(` · owed at keys ${brl0(s.owedAtKeys)}, bank lends ${brl0(s.loan)}`, ` · devido nas chaves ${brl0(s.owedAtKeys)}, banco financia ${brl0(s.loan)}`) : '')
